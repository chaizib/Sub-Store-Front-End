name: build
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "package.json"
  pull_request:
    branches:
      - master
    paths:
      - "package.json"
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: "master"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
      - name: Install dependencies
        run: |
          corepack enable
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile
      - name: build
        run: |
          pnpm build
      - uses: amondnet/vercel-action@v42 #deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }} # Required
          vercel-org-id: ${{ secrets.ORG_ID}} # Required
          vercel-project-id: ${{ secrets.PROJECT_ID}} # Required
          # 关键修改：加上 --yes 跳过确认，并把要部署的目录明确指定为 dist
          vercel-args: "--prod --debug --yes" 
          # 删掉 working-directory: dist
          working-directory: ./
          vercel-version: "48.9.0"
      - name: zip
        run: |
          zip -r dist.zip dist
      - id: tag
        name: Generate release tag
        run: |
          SUB_STORE_RELEASE="$(node --eval='process.stdout.write(require("./package.json").version)')"
          echo "release_tag=$SUB_STORE_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Prepare release
        run: |
          pnpm i -D conventional-changelog-cli
          pnpm run changelog
      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: ./CHANGELOG.md
          tag_name: ${{ steps.tag.outputs.release_tag }}
          # generate_release_notes: true
          files: |
            dist.zip
